spring.application.name=Project02_VehiclesJDBCspringBoot

# in root we are in mode info
logging.level.root=info

# for other paths, we are in debug
logging.level.com.betacom = debug

# display date, [processo], [thread], messaggio
logging.pattern.console = %d{"yyyy/MM/dd HH:mm:ss,SSS"} [%p] [%t] %M\\(%F:%L\\) - %msg%n

# we need to parametrize the connection in MYSQL
# url where we connect
# username and pwd (inside .env of Docker folder)
spring.datasource.url = jdbc:postgresql://localhost:5432/vehiclesTv
spring.datasource.username=postgres
spring.datasource.password=password